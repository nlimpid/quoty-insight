[package]
name = "quoty-insight"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "migration"]

[dependencies]
futures = "0.3.31"
tokio = { version = "1", features = ["full"] }
migration = { path = "migration" } # depends on your needs
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
    "fmt",
    "json",
    "env-filter",
] }
url = "2.5.4"
longport = "2.1.12"
time-macros = "0.2.22"
influxdb3_client = { git = "https://github.com/influxdata/influxdb.git", tag = "v3.0.1" }
influxdb3_types = { git = "https://github.com/influxdata/influxdb.git", tag = "v3.0.1" }
dotenv = "0.15.0"
# see here https://github.com/apache/arrow-rs/issues/7201
chrono = "= 0.4.39"
arrow = "54.2.0"
config = { version = "0.15.11", features = ["yaml"] }
clap = { version = "4.5.34", features = ["derive"] }
anyhow = "1.0.97"
serde = "1.0.219"
serde_json = "1.0.140"

[dev-dependencies]
